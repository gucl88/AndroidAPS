# 放到 GitHub 仓库 .github/workflows/build-release.yml
# 签名方式与 android.yml 完全一致：仓库自带 keystore/demokeystore.jks + STORE_PASSWORD/KEY_ALIAS/KEY_PASSWORD
# 不需要 KEYSTORE_SET/KEYSTORE_BASE64/GDRIVE_OAUTH2，产物走 GitHub Artifact
name: Build AAPS Release (No Google Drive)

on:
  workflow_dispatch:
    inputs:
      buildWear:
        description: '同时编手表端'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Validate keystore
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          set -e
          # 仓库里提交的 demokeystore.jks 就是历史 APK 的签名来源
          KS="$GITHUB_WORKSPACE/keystore/demokeystore.jks"
          ls -la "$KS"
          if ! keytool -list -keystore "$KS" -storepass "$STORE_PASSWORD" > /tmp/ks_list.txt 2>&1; then
            echo "❌ demokeystore.jks 与 STORE_PASSWORD 不匹配（keytool -list 失败）"
            sed -E 's/[A-Za-z0-9+/=]{40,}/[REDACTED]/g' /tmp/ks_list.txt | head -20
            exit 1
          fi
          if ! grep -qi "$KEY_ALIAS" /tmp/ks_list.txt; then
            echo "❌ alias '$KEY_ALIAS' 在 demokeystore.jks 里不存在！真实 alias："
            grep -iE "^[A-Za-z0-9_.-]+(,|$)" /tmp/ks_list.txt | head -5
            exit 1
          fi
          echo "✅ 仓库 keystore + STORE_PASSWORD + KEY_ALIAS 全部匹配"

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Build APK
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          STORE_FILE: keystore/demokeystore.jks
        run: |
          set -e
          # 与 android.yml 相同：环境变量供 gradle 的 getStoreFile()/getStorePassword() 回退读取
          export storePassword="$STORE_PASSWORD"
          export keyAlias="$KEY_ALIAS"
          export keyPassword="${KEY_PASSWORD:-$STORE_PASSWORD}"
          export storeFile="$STORE_FILE"
          TASKS=":app:assembleFullRelease"
          if [ "${{ github.event.inputs.buildWear }}" = "true" ]; then
            TASKS="$TASKS :wear:assembleFullRelease"
          fi
          ./gradlew $TASKS \
            -Dorg.gradle.jvmargs="-Xmx8g -XX:+UseParallelGC -Xss1024m" \
            -Dkotlin.daemon.jvm.options="-Xmx2g" \
            -Dkotlin.compiler.execution.strategy="in-process" \
            -Dorg.gradle.daemon=true \
            -Dorg.gradle.workers.max=8 \
            -Dorg.gradle.caching=true

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: aaps-release
          path: |
            app/build/outputs/apk/full/release/*.apk
            wear/build/outputs/apk/full/release/*.apk
          if-no-files-found: warn
